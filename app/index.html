<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time entries</title>
<style>
  body { font: 15px/1.4 system-ui, sans-serif; max-width: 60rem; margin: 1rem auto; padding: 0 1rem; color: #222; }
  header, .bar { display: flex; flex-wrap: wrap; gap: .75rem 1.25rem; align-items: center; }
  header { position: sticky; top: 0; background: #fff; padding: .5rem 0; border-bottom: 1px solid #ccc; }
  label { display: inline-flex; gap: .4rem; align-items: center; }
  .total { margin-left: auto; font-weight: 600; }
  .day { border: 1px solid #ccc; border-radius: 6px; margin: .75rem 0; padding: .6rem .8rem; }
  .day.done { background: #f1f8f1; border-color: #9c9; }
  .day.skipped { opacity: .55; }
  .day h2 { font-size: 1rem; margin: 0 0 .4rem; display: flex; gap: 1rem; align-items: baseline; }
  .msgs { margin: 0 0 .6rem; padding: 0; list-style: none; font-size: 13px; }
  .msgs li { display: grid; grid-template-columns: 3rem 5rem 14rem 1fr; gap: .5rem; padding: 1px 0; }
  .msgs .who, .msgs .subj { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msgs li { cursor: pointer; }
  .msgs li:hover { background: #f5f5f5; }
  .msgs .read { display: none; grid-column: 1 / -1; background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: .5rem .7rem; margin: 2px 0 6px; cursor: text; white-space: pre-wrap; font-size: 13px; max-height: 24rem; overflow: auto; }
  .msgs .read .hdr { color: #666; margin-bottom: .4rem; }
  .msgs li.open .read { display: block; }
  .entry { display: flex; gap: .6rem; align-items: flex-start; }
  .entry textarea { flex: 1; min-height: 2.6rem; font: inherit; }
  .entry input[type=number] { width: 5rem; font: inherit; }
  button { font: inherit; padding: .3rem .7rem; }
  #empty { color: #666; margin-top: 2rem; }
  /* Keep the time entry in view while he reads a long message above it. */
  .entrybox { position: sticky; bottom: 0; background: #fff; border-top: 1px solid #ccc; padding-top: .4rem; z-index: 1; }
  .day.done .entrybox { background: #f1f8f1; }
  .msgs .read { max-height: 35vh; }
  .entry textarea { min-height: 2.2rem; }
  @media (max-height: 800px) { header { position: static; } }
</style>
</head>
<body>
<header>
  <button id="pickMsgs">Choose messages file…</button>
  <button id="reopenMsgs" hidden></button>
  <label id="msgsFallback">Messages file <input type="file" id="csvFile" accept=".json,.csv"></label>
  <label>From <input type="date" id="start" value="2026-06-22"></label>
  <label>To <input type="date" id="end"></label>
  <label title="0 is the first Google account signed in to this browser; use his email address if Gmail opens the wrong account">Gmail account <input type="text" id="account" value="0" style="width:9rem"></label>
  <label>Rate $/hr <input type="number" id="rate" min="0" step="1" style="width:5rem"></label>
  <span class="total" id="total"></span>
</header>
<details id="storage" style="margin:.6rem 0">
  <summary>Where entries are saved (GitHub)</summary>
  <div class="bar" style="margin:.5rem 0">
    <label>Repository <input type="text" id="repo" value="anthonylawoffice/client-data" style="width:15rem"></label>
    <label>Client folder <input type="text" id="folder" value="fl1capital" style="width:8rem"></label>
    <label>Invoice <input type="text" id="invoice" value="2026-06-22" style="width:8rem"></label>
    <label title="A fine-grained token limited to this one repository, with Contents read and write. Kept in this browser until the expiry date.">Token <input type="password" id="token" autocomplete="off" style="width:12rem"></label>
    <label title="The expiry date you chose when making the token. The page forgets it then. Blank means 30 days.">Token expires <input type="date" id="tokenExp"></label>
    <button id="forgetToken">Forget token</button>
  </div>
</details>
<div class="bar" style="margin:.6rem 0">
  <button id="save">Save</button>
  <button id="load">Load saved</button>
  <button id="wp" title="Copies the time entries as a table. Paste it into the invoice in WordPerfect.">Copy for WordPerfect</button>
  <button id="txt" title="Copies one line per entry, separated by tabs. Paste it into the invoice as ordinary text.">Copy as text</button>
  <button id="rtf"title="Downloads a file with the entries as a table. Open it in WordPerfect, then copy the table into the invoice.">Download for WordPerfect (RTF)</button>
  <button id="export">Export CSV</button>
  <button id="copy">Download a copy</button>
  <label>Import old file <input type="file" id="jsonFile" accept=".json"></label>
  <span id="status" style="color:#666"></span>
</div>
<div id="days"><p id="empty">Choose the messages file to begin.</p></div>

<script>
"use strict";
// Everything stays in this page. Nothing is uploaded.
let messages = [];          // [{date,time,direction,from,to,cc,subject}]
let entries = {};           // {"2026-07-01": {hours, description, skipped}}
let dirty = false;

const $ = (id) => document.getElementById(id);

function parseCSV(text) {
  const rows = []; let row = [], field = "", q = false;
  text = text.replace(/^﻿/, "");
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else if (c !== "\r") field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  const head = rows.shift();
  return rows.filter(r => r.length === head.length)
    .map(r => Object.fromEntries(head.map((h, i) => [h, r[i]])));
}

function markDirty(v = true) { dirty = v; $("status").textContent = v ? "Unsaved changes" : ""; }
window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

// A day holds {skipped, rows: [{hours, description}]}. Files saved before
// multiple rows existed have {hours, description, skipped}; they become one row.
function dayEntry(date) {
  const e = entries[date] || (entries[date] = { skipped: false });
  if (!e.rows) {
    e.rows = [{ hours: e.hours ?? "", description: e.description ?? "" }];
    delete e.hours; delete e.description;
  }
  return e;
}

function totals() {
  let h = 0;
  for (const d of Object.keys(entries)) {
    const e = dayEntry(d);
    if (!e.skipped) for (const r of e.rows) h += Number(r.hours) || 0;
  }
  const rate = Number($("rate").value) || 0;
  $("total").textContent = `${h.toFixed(2)} hours` + (rate ? ` · $${(h * rate).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}` : "");
}

function el(tag, props = {}, ...kids) {
  const n = Object.assign(document.createElement(tag), props);
  n.append(...kids);
  return n;
}

function render() {
  const start = $("start").value, end = $("end").value;
  const byDay = new Map();
  for (const m of messages) {
    if ((start && m.date < start) || (end && m.date > end)) continue;
    if (!byDay.has(m.date)) byDay.set(m.date, []);
    byDay.get(m.date).push(m);
  }
  const root = $("days");
  root.replaceChildren();
  if (!byDay.size) { root.append(el("p", { id: "empty", textContent: messages.length ? "No messages in that range." : "Choose the messages file to begin." })); totals(); return; }

  for (const date of [...byDay.keys()].sort()) {
    const msgs = byDay.get(date);
    const e = dayEntry(date);
    const sent = msgs.filter(m => m.direction === "sent").length;
    const dow = new Date(date + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
    const card = el("section", { className: "day" });
    const refresh = () => {
      card.classList.toggle("skipped", e.skipped);
      card.classList.toggle("done", !e.skipped && e.rows.some(r => Number(r.hours) > 0));
    };

    card.append(el("h2", {}, dow, el("small", { textContent: `${sent} sent · ${msgs.length - sent} received`, style: "font-weight:400;color:#666" })));
    const ul = el("ul", { className: "msgs" });
    for (const m of msgs) {
      const other = m.direction === "sent" ? m.to : m.from;
      const files = m.attachments && m.attachments.length ? ` 📎${m.attachments.length}` : "";
      const li = el("li", {},
        el("span", { textContent: m.time }),
        el("span", { textContent: m.direction === "sent" ? "sent to" : "from" }),
        el("span", { className: "who", textContent: other, title: other }),
        el("span", { className: "subj", textContent: m.subject + files, title: m.subject }));
      const gmail = m.messageId ? el("a", {
        textContent: "Open in Gmail", target: "_blank", rel: "noopener",
      }) : "";
      if (gmail) {
        // Build the address when clicked, so a changed "Gmail account" applies at once.
        const setHref = () => { gmail.href = `https://mail.google.com/mail/u/${encodeURIComponent($("account").value.trim() || "0")}/#search/${encodeURIComponent("rfc822msgid:" + m.messageId)}`; };
        setHref();
        gmail.addEventListener("click", (e) => { e.stopPropagation(); setHref(); });
      }
      li.append(el("div", { className: "read" }, ...(m.body === undefined ? [] : [
        el("div", { className: "hdr" }, `From: ${m.from}\nTo: ${m.to}${m.cc ? "\nCc: " + m.cc : ""}\n`, gmail),
        ...(files ? [el("div", { textContent: "Attachments: " + m.attachments.join(", "), className: "hdr" })] : []),
        el("div", { textContent: m.body })])));
      li.addEventListener("click", () => li.classList.toggle("open"));
      ul.append(li);
    }
    card.append(ul);

    const rowsBox = el("div");
    const drawRows = () => {
      rowsBox.replaceChildren();
      e.rows.forEach((r, i) => {
        const hours = el("input", { type: "number", min: 0, step: 0.25, value: r.hours, placeholder: "hrs", title: "Hours, in quarter hours" });
        hours.addEventListener("input", () => { r.hours = hours.value; refresh(); totals(); markDirty(); });
        hours.addEventListener("change", () => {          // snap to the nearest quarter hour
          if (hours.value !== "") { r.hours = hours.value = (Math.round(Number(hours.value) * 4) / 4).toString(); totals(); }
        });
        const desc = el("textarea", { value: r.description, placeholder: "Description of work" });
        desc.addEventListener("input", () => { r.description = desc.value; markDirty(); });
        const remove = el("button", { textContent: "✕", title: "Remove this entry", hidden: e.rows.length < 2 });
        remove.addEventListener("click", () => { e.rows.splice(i, 1); drawRows(); totals(); markDirty(); });
        rowsBox.append(el("div", { className: "entry" }, hours, desc, remove));
      });
      refresh();
    };
    const add = el("button", { textContent: "+ Add entry" });
    add.addEventListener("click", () => { e.rows.push({ hours: "", description: "" }); drawRows(); markDirty(); });
    const skip = el("input", { type: "checkbox", checked: e.skipped });
    skip.addEventListener("change", () => { e.skipped = skip.checked; refresh(); totals(); markDirty(); });

    card.append(el("div", { className: "entrybox" }, rowsBox,
      el("div", { className: "entry", style: "margin-top:.4rem" }, add, el("label", {}, skip, "not billable"))));
    drawRows();
    root.append(card);
  }
  totals();
}

function download(name, type, text) {
  const a = el("a", { href: URL.createObjectURL(new Blob([text], { type })), download: name });
  a.click(); URL.revokeObjectURL(a.href);
}

const say = (s) => { $("status").textContent = s; };

// ---- Messages file: remembered across refreshes -------------------------
// Chrome and Edge let a page keep a *pointer* to a file the user chose. We
// store only that pointer (in this browser), never the email text itself.
const canPickOpen = "showOpenFilePicker" in window;
const kv = (mode, fn) => new Promise((res, rej) => {
  const open = indexedDB.open("legal-bill", 1);
  open.onupgradeneeded = () => open.result.createObjectStore("kv");
  open.onerror = () => rej(open.error);
  open.onsuccess = () => {
    const tx = open.result.transaction("kv", mode);
    const r = fn(tx.objectStore("kv"));
    tx.oncomplete = () => res(r.result);
    tx.onerror = () => rej(tx.error);
  };
});

async function loadMessagesText(name, text) {
  messages = name.endsWith(".json") ? JSON.parse(text) : parseCSV(text);
  render();
}
async function loadMessagesHandle(h) {
  await loadMessagesText(h.name, await (await h.getFile()).text());
  $("reopenMsgs").hidden = true;
}

if (canPickOpen) {
  $("msgsFallback").hidden = true;
  $("pickMsgs").addEventListener("click", async () => {
    try {
      const [h] = await showOpenFilePicker({ types: [{ description: "Messages", accept: { "application/json": [".json"], "text/csv": [".csv"] } }] });
      await kv("readwrite", (s) => s.put(h, "messagesHandle"));
      await loadMessagesHandle(h);
    } catch (e) { if (e.name !== "AbortError") alert(e.message); }
  });
  // On page load: reuse last time's file if the browser still allows it,
  // otherwise offer a one-click button (the browser needs a click to re-allow).
  kv("readonly", (s) => s.get("messagesHandle")).then(async (h) => {
    if (!h) return;
    try {
      if (await h.queryPermission({ mode: "read" }) === "granted") return loadMessagesHandle(h);
    } catch { return; }
    const b = $("reopenMsgs");
    b.textContent = `Reopen ${h.name}`; b.hidden = false;
    b.onclick = async () => {
      try { if (await h.requestPermission({ mode: "read" }) === "granted") await loadMessagesHandle(h); }
      catch (e) { alert(e.message); }
    };
  }).catch(() => {});
} else {
  $("pickMsgs").hidden = true;
}
$("csvFile").addEventListener("change", async (ev) => {
  const f = ev.target.files[0]; if (f) loadMessagesText(f.name, await f.text());
});

// ---- Entries: saved to the client-data repo through the GitHub API -------
const settingIds = ["repo", "folder", "invoice"];
for (const id of settingIds) {
  const v = localStorage.getItem("setting." + id);
  if (v) $(id).value = v;
  $(id).addEventListener("input", () => { localStorage.setItem("setting." + id, $(id).value); sha = null; });
}
// The token stays in this browser until its expiry date, then is forgotten.
// Anything that can read this page's storage (such as a malicious extension)
// could read it, so it should be a token limited to the one repository.
function storeToken() {
  const token = $("token").value.trim();
  if (!token) { localStorage.removeItem("token"); return; }
  if (!$("tokenExp").value) $("tokenExp").value = new Date(Date.now() + 30 * 864e5).toISOString().slice(0, 10);
  localStorage.setItem("token", JSON.stringify({ token, expires: $("tokenExp").value }));
}
try {
  const saved = JSON.parse(localStorage.getItem("token") || "null");
  if (saved && saved.expires >= new Date().toISOString().slice(0, 10)) {
    $("token").value = saved.token; $("tokenExp").value = saved.expires;
  } else if (saved) { localStorage.removeItem("token"); say("The saved token expired. Paste a new one."); }
} catch { localStorage.removeItem("token"); }
$("token").addEventListener("input", storeToken);
$("tokenExp").addEventListener("change", storeToken);
$("forgetToken").addEventListener("click", () => { localStorage.removeItem("token"); $("token").value = ""; $("tokenExp").value = ""; say("Token forgotten."); });

let sha = null;   // version of the saved file we last saw; GitHub refuses a save over a newer one

function target() {
  const clean = (s) => s.trim().replace(/[^A-Za-z0-9._-]+/g, "-").replace(/^\.+/, "");
  const repo = $("repo").value.trim(), folder = clean($("folder").value), invoice = clean($("invoice").value);
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) throw new Error("Repository should look like owner/name.");
  if (!folder || !invoice) throw new Error("Fill in the client folder and the invoice name.");
  if (!$("token").value.trim()) throw new Error("Paste the GitHub token first (Where entries are saved).");
  return { url: `https://api.github.com/repos/${repo}/contents/${folder}/invoices/${invoice}.json`, label: `${folder}/invoices/${invoice}.json` };
}
const gh = (url, opts = {}) => fetch(url, { ...opts, headers: {
  Authorization: `Bearer ${$("token").value.trim()}`, Accept: "application/vnd.github+json",
  "X-GitHub-Api-Version": "2022-11-28", ...(opts.headers || {}) } });
const toB64 = (s) => { let b = ""; for (const x of new TextEncoder().encode(s)) b += String.fromCharCode(x); return btoa(b); };
const fromB64 = (s) => new TextDecoder().decode(Uint8Array.from(atob(s), (c) => c.charCodeAt(0)));
const ghError = async (r) => `GitHub said ${r.status}: ${(await r.json().catch(() => ({}))).message || r.statusText}`;

function applyEntries(data) {
  entries = data.entries || {};
  if (data.rate) $("rate").value = data.rate;
  markDirty(false); render();
}

async function loadSaved() {
  try {
    const t = target();
    say("Loading…");
    const r = await gh(t.url);
    if (r.status === 404) { sha = null; say(`Nothing saved yet at ${t.label}`); return; }
    if (!r.ok) throw new Error(await ghError(r));
    const f = await r.json();
    sha = f.sha;
    applyEntries(JSON.parse(fromB64(f.content)));
    say(`Loaded ${t.label}`);
  } catch (e) { say(""); alert(e.message); }
}

async function saveEntries() {
  try {
    const t = target();
    say("Saving…");
    const body = { message: `Update time entries (${t.label})`, content: toB64(JSON.stringify({ rate: $("rate").value, entries }, null, 2)) };
    if (sha) body.sha = sha;
    const r = await gh(t.url, { method: "PUT", body: JSON.stringify(body) });
    if (r.status === 409 || r.status === 422) throw new Error("The saved copy changed since you loaded it (or it already exists). Click “Load saved” first, then make your changes again.");
    if (!r.ok) throw new Error(await ghError(r));
    sha = (await r.json()).content.sha;
    markDirty(false);
    say(`Saved ${new Date().toLocaleTimeString()} to ${t.label}`);
  } catch (e) { say(""); alert(e.message); }
}

$("save").addEventListener("click", saveEntries);
$("load").addEventListener("click", () => { if (!dirty || confirm("Discard unsaved changes and load the saved copy?")) loadSaved(); });
$("copy").addEventListener("click", () => download("entries.json", "application/json", JSON.stringify({ rate: $("rate").value, entries }, null, 2)));
$("jsonFile").addEventListener("change", async (ev) => {
  const f = ev.target.files[0]; if (!f) return;
  try { applyEntries(JSON.parse(await f.text())); markDirty(true); } catch { alert("That file isn't a saved entries file."); }
});
if ($("token").value) loadSaved();            // refreshing the page picks up where he left off

for (const id of ["start", "end"]) $(id).addEventListener("change", render);
$("rate").addEventListener("input", totals);
// Builds the table off-screen, selects it, and copies. That puts both a rich
// table and tab-separated plain text on the clipboard, which word processors
// (WordPerfect included) accept as a paste.
// The invoice lines as [date, description, hours] plus a total line, in his
// style: dates M/D/YY, hours like .5 or 1.25, dollars only on the total line.
// Shared by every "to WordPerfect" button.
function invoiceLines() {
  const rate = Number($("rate").value) || 0;
  const money = (n) => "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const us = (iso) => `${+iso.slice(5, 7)}/${+iso.slice(8, 10)}/${iso.slice(2, 4)}`;
  const hrs = (h) => String(+h.toFixed(2)).replace(/^0\./, ".");
  const start = $("start").value, end = $("end").value;
  const body = []; let total = 0;
  for (const d of Object.keys(entries).sort()) {
    if ((start && d < start) || (end && d > end)) continue;
    const e = dayEntry(d);
    if (e.skipped) continue;
    for (const r of e.rows) {
      const h = Number(r.hours) || 0;
      if (h <= 0) continue;
      total += h;
      body.push([us(d), r.description.replace(/\s*\n\s*/g, " ").trim(), hrs(h)]);
    }
  }
  if (!body.length) { alert("No billable entries in this date range yet."); return null; }
  const count = body.length;
  body.push(["", "total this invoice", hrs(total) + (rate ? `   ${money(total * rate)}` : "")]);
  return { body, count, hours: hrs(total) };
}

// RTF is a format WordPerfect imports well, tables included.
$("rtf").addEventListener("click", () => {
  const inv = invoiceLines(); if (!inv) return;
  const esc = (s) => [...s].map((ch) => {
    const c = ch.charCodeAt(0);
    if (ch === "\\" || ch === "{" || ch === "}") return "\\" + ch;
    return c > 126 ? `\\u${c > 32767 ? c - 65536 : c}?` : ch;
  }).join("");
  const widths = [1300, 6500, 1560];                 // twips: date, description, hours
  const edges = widths.map((w, i) => widths.slice(0, i + 1).reduce((a, b) => a + b));
  const row = (cells) => "\\trowd\\trgaph108\\trleft0" + edges.map((x) => `\\cellx${x}`).join("") +
    cells.map((c, i) => `\\pard\\intbl${i === 2 ? "\\qr" : "\\ql"} ${esc(c)}\\cell`).join("") + "\\row\n";
  const rtf = "{\\rtf1\\ansi\\deff0{\\fonttbl{\\f0 Times New Roman;}}\\f0\\fs24\n" + inv.body.map(row).join("") + "}";
  download("time-entries.rtf", "application/rtf", rtf);
  say(`RTF has ${inv.count} entries, ${inv.hours} hours. Open it in WordPerfect and copy the table into the invoice.`);
});

// Plain text, one line per entry: date <tab> description <tab> hours. It pastes
// as ordinary text, so it takes on the tab stops of wherever it lands.
$("txt").addEventListener("click", async () => {
  const inv = invoiceLines(); if (!inv) return;
  const text = inv.body.map((r) => r.join("\t")).join("\r\n");
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = el("textarea", { value: text, style: "position:fixed;left:-9999px" });
    document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
  say(`Copied ${inv.count} entries as text with tabs. Paste into the invoice.`);
});

$("wp").addEventListener("click", () => {
  const inv = invoiceLines(); if (!inv) return;
  const { body, count: entryCount, hours } = inv;
  const table = el("table", { style: "border-collapse:collapse" });
  const addRow = (cells, tag) => table.append(el("tr", {}, ...cells.map((c, i) =>
    el(tag, { textContent: c, style: `padding:2px 8px;vertical-align:top;${i === 2 ? "text-align:right;" : ""}` }))));
  body.forEach((r) => addRow(r, "td"));
  const holder = el("div", { style: "position:fixed;left:-9999px;top:0" }, table);
  document.body.append(holder);
  const sel = getSelection(); sel.removeAllRanges();
  const range = document.createRange(); range.selectNodeContents(table); sel.addRange(range);
  const ok = document.execCommand("copy");
  sel.removeAllRanges(); holder.remove();
  say(ok ? `Copied ${entryCount} entries, ${hours} hours. Paste into WordPerfect.` : "Copy was blocked by the browser.");
});

$("export").addEventListener("click", () => {
  const q = (s) => `"${String(s).replace(/"/g, '""')}"`;
  const lines = ["date,hours,description"];
  for (const d of Object.keys(entries).sort()) {
    const e = dayEntry(d);
    if (e.skipped) continue;
    for (const r of e.rows) if (Number(r.hours) > 0) lines.push([d, r.hours, q(r.description)].join(","));
  }
  download("time-entries.csv", "text/csv", lines.join("\n"));
});
